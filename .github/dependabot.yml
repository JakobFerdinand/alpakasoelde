# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Vienna"
    groups:
      github-actions-all:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Vienna"
    groups:
      devcontainers-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/src/website/"
      - "/src/dashboard/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Vienna"
    groups:
      npm-all:
        patterns:
          - "*"
    ignore:
      # Keep website and dashboard pinned to TypeScript 6 until they support newer majors
      - dependency-name: "typescript"
        versions:
          - ">=7"

  - package-ecosystem: "nuget"
    directories:
      - "/src/website-api/"
      - "/src/dashboard-api/"
      - "/src/website-api-tests/"
      - "/src/dashboard-api-tests/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Vienna"
    groups:
      nuget-all:
        patterns:
          - "*"
