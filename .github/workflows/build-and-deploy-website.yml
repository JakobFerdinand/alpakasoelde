name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'src/website/**'
      - 'src/website-api/**'
      - 'src/website-api-tests/**'
      - 'alpakasoelde.slnx'
      - 'global.json'
      - '.github/workflows/build-and-deploy-website.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'src/website/**'
      - 'src/website-api/**'
      - 'src/website-api-tests/**'
      - 'alpakasoelde.slnx'
      - 'global.json'
      - '.github/workflows/build-and-deploy-website.yml'

permissions:
  contents: read
  pull-requests: write 
  
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./src/website/pnpm-lock.yaml

      - name: PNPM Install
        run: pnpm install
        working-directory: ./src/website

      - name: Astro Check
        run: pnpm run check
        working-directory: ./src/website

      - name: Unit Tests
        run: pnpm test
        working-directory: ./src/website

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: API Tests
        run: dotnet test --project src/website-api-tests/website-api-tests.csproj

      - name: Build Functions
        run: dotnet publish src/website-api/website-api.csproj -c Release -o website-api_output

      - name: Build Page
        run: pnpm run build
        working-directory: ./src/website

      # Installed explicitly rather than through the `pretest:e2e` hook, which
      # only fires when pnpm has pre/post scripts enabled. `--with-deps` pulls
      # the shared libraries the runner image lacks.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./src/website

      - name: E2E Tests
        run: pnpm run test:e2e
        working-directory: ./src/website

      # `trace: retain-on-failure` writes traces here; the run may also have
      # failed before Playwright ever started, hence if-no-files-found: ignore.
      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: src/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy
        if: github.actor != 'dependabot[bot]'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./src/website/dist" # App source code path
          api_location: "./website-api_output" # Published API path
          output_location: "." # Built app content directory
          config_file_location: "/src/website/"
          skip_api_build: true
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
